#========================================================================
# Copy this file to archive_saver.conf and edit its content.
#========================================================================

#------------------------------------------------------------------------
# Web server from which the archives have to be pulled:
#------------------------------------------------------------------------
# User account on the web server to be logged in
userAtWebsrv="webserver_user@webserver-domain.tld"
# Absolute path to the backup archives on the web server
websrvDir="/path/to/archives/folder/"
# Absolute target dir on the web server for the listing of saved archives
websrvListingDir="/path/to/listing/folder/"

#------------------------------------------------------------------------
# External storage device where the archives have to be pushed:
#------------------------------------------------------------------------
# User account to access when uploading archives
userAtStorage="storage_user@external.storage.tld"
# Absolute path where the archives have to be stored
storageDir="/path/to/archives/folder/"
# Max number of kept archives for each website
maxStoredArchives=42

#------------------------------------------------------------------------
# On the server which does the pulling and pushing of the archives:
#------------------------------------------------------------------------
# Absolute path to the dir where the listing of backup archives is stored
backupListDir="/webserver/path/to/listing/folder/"
# Name of the listing
pullBackupList="archive-listing.txt"
# Command to execute SFTP, -P specifies any non-standard SSH port
sftpFromWebsrv="sftp -P 2342"
# Command to execute scp, -P specifies any non-standard SSH port,
# -p preserves the metadata of the copied files
scpWebsrv="scp -p -P 4621"

