# -------------------------------------------------------------------
# If "apache_vhost_dir" is defined, the web root directories are
# extracted from the Apache2 virtual host configuration files. 
# Otherwise, web root directories are taken from the comma-separated 
# list of directory paths in "web_roots".
#
# Access to the Apache configuration files is usually prohibited on 
# commercial hosting services. The same applies to "run_as_root".
# -------------------------------------------------------------------
[website_reporter]
# Switch to False on commercial hosting services.
run_as_root = True
# Adjust these commands if necessary.
joomla_cli = php8.4 cli/joomla.php
mediawiki_cli = php8.4 maintenance/
# WP_CLI must be installed separately.
wp_cli = wp

# If commented out, WORDFENCE_CLI isn't called, but it was closed in Oct 2026 anyway.
#wordfence_cli = wordfence

# The following parameters are used to access the wordfence DB directly:
# ....................................................................................
# Enter access token for the Wordfence vulnerability JSON file!
#wf_api_token = none
# Path to the wordfence data folder
#wf_folder = /path/to/folder
#.....................................................................................
# Default values. Change if nececcary.
#wf_feed_url = https://www.wordfence.com/api/intelligence/v3/vulnerabilities/production
#wf_json_file = wordfence_production.json
#wf_etag_file = wordfence_production.etag
#wf_json_reduced_file = wordfence_reduced.json
# SQlite DB of the wordfence data
#wf_db_file = wordfence.db
# ....................................................................................

# Absolute or relative path to a file which contains hashes of 
# known benign source code files.
known_benign_scripts = known_script_hashes

# If commented out, no CMS users will be shown.
show_cms_users = True
# Comment out "apache_vhost_dir" to use the "web_roots" list instead.
apache_vhost_dir = /etc/apache2/sites-enabled
web_roots = 
    /var/www/html,
    /var/www/joomla,
    /var/www/mediawiki,
    /var/www/wordpress
