# Copy this file to switch_to_maintenance_config.ini
# and edit the entries as required.
[switchable_doc_roots]
# This setting determines whether the script should check if it is run as root.
run_as_root = false
# This is the path where the files of all websites are stored. 
server_root = /var/www
# This is a list of folders within server_root.
# Each folder should contain the files of a website.
doc_folders = mydrupal, myjoomla, mymediawiki, mywordpress
